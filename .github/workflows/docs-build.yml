name: Docs build

on:
  pull_request:
    paths:
      - '.github/workflows/docs-build.yml'
      - 'docs/**'
      - 'docs.ps1'
      - 'README.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/docs-build.yml'
      - 'docs/**'
      - 'docs.ps1'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN || github.token }}

      - name: Verify documentation template image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseImage = 'ghcr.io/the-running-dev/docs-template:latest'

          docker buildx imagetools inspect $baseImage
          if ($LASTEXITCODE -ne 0) {
            throw "Documentation template image '$baseImage' does not exist or is not accessible."
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build documentation image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = 'containerpsgenerator-docs:${{ github.sha }}'
          ./docs.ps1 -BuildOnly -Tag $image

      - name: Build and copy static site
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = 'containerpsgenerator-docs:${{ github.sha }}'
          $container = 'containerpsgenerator-docs-build'
          $output = './artifacts/docs'

          docker create --name $container $image sh -c 'pnpm run build' | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Creating the documentation build container failed with exit code $LASTEXITCODE."
          }

          docker start --attach $container
          if ($LASTEXITCODE -ne 0) {
            throw "Building the static documentation failed with exit code $LASTEXITCODE."
          }

          New-Item -ItemType Directory -Path $output -Force | Out-Null
          docker cp "${container}:/template/artifacts/." $output
          if ($LASTEXITCODE -ne 0) {
            throw "Copying the static documentation failed with exit code $LASTEXITCODE."
          }

      - name: Remove documentation build container
        if: ${{ always() }}
        shell: pwsh
        run: |
          $container = docker ps --all `
            --filter 'name=^/containerpsgenerator-docs-build$' `
            --format '{{.Names}}'
          if ($container) {
            docker rm --force containerpsgenerator-docs-build
          }

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/docs

  deploy:
    name: Deploy documentation
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
