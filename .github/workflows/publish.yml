name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  github-packages:
    name: GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release version
        uses: The-Running-Dev/GitHub-ActionTemplates/actions/assert-tag-version@v0
        with:
          manifest: src/SubZeroDev.PSGenerator.psd1
          tag: ${{ github.ref_name }}

      - name: Build and verify package
        shell: pwsh
        run: ./build/Test-GeneratorNuGetPackage.ps1 -InstallDependencies

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: generator-nuget-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push 'artifacts/packages/*.nupkg' --api-key $env:GITHUB_TOKEN --source 'https://nuget.pkg.github.com/The-Running-Dev/index.json'
