name: Container

# Builds the PSGenerator image on every change that can affect it, and publishes
# it from main. Pull requests build and smoke-test without pushing, so a broken
# image is caught before merge rather than after.

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'src/**'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/the-running-dev/subzerodev.psgenerator

defaults:
  run:
    shell: pwsh

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # verification: true
      - name: Build image
        run: docker build --tag psgenerator:ci .

      # The Dockerfile already fails the build if the module cannot be imported.
      # This checks the image from the outside as a consumer would.
      # verification: true
      - name: Smoke test image
        run: pwsh -NoProfile -File ./build/Test-ContainerImage.ps1 -Image psgenerator:ci

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # Date-based versions give consumers something immutable to pin, while
      # latest tracks main.
      - name: Tag and push
        if: github.event_name != 'pull_request'
        run: ./build/Publish-ContainerImage.ps1 -Repository $env:IMAGE
