name: Container

# Builds the PSGenerator image on every change that can affect it, and publishes
# it from main. Pull requests build and smoke-test without pushing, so a broken
# image is caught before merge rather than after.

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'src/**'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/the-running-dev/subzerodev.psgenerator

defaults:
  run:
    shell: pwsh

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        run: |
          docker build --tag psgenerator:ci .
          if ($LASTEXITCODE -ne 0) {
            throw "Building the container image failed with exit code $LASTEXITCODE."
          }

      # The Dockerfile already fails the build if the module cannot be imported.
      # This checks the image from the outside as a consumer would: pwsh as the
      # entry point, the module resolvable by name, and every manifest command
      # present.
      - name: Smoke test image
        run: |
          $version = docker run --rm psgenerator:ci -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw 'The image did not start pwsh.' }
          if ($version -notmatch '^7\.4\.') {
            throw "Image reports PowerShell '$version'; the module manifest requires 7.4."
          }

          $manifest = Test-ModuleManifest ./src/SubZeroDev.PSGenerator.psd1
          $expected = @($manifest.ExportedFunctions.Keys | Sort-Object)
          $actual = @(
            docker run --rm psgenerator:ci -NoLogo -NoProfile -Command `
              '(Get-Command -Module SubZeroDev.PSGenerator).Name | Sort-Object'
          )
          if ($LASTEXITCODE -ne 0) { throw 'The image could not list module commands.' }
          if (Compare-Object $expected $actual) {
            throw "Image commands do not match the manifest. Expected: $($expected -join ', '). Actual: $($actual -join ', ')."
          }

          Write-Host "Image runs PowerShell $version and exposes $($actual.Count) commands."

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # Date-based versions give consumers something immutable to pin, while
      # latest tracks main.
      - name: Tag and push
        if: github.event_name != 'pull_request'
        run: |
          $version = Get-Date -Format 'yyyy.MM.dd'
          foreach ($tag in @("$env:IMAGE`:$version", "$env:IMAGE`:latest")) {
            docker tag psgenerator:ci $tag
            if ($LASTEXITCODE -ne 0) { throw "Tagging '$tag' failed." }

            docker push $tag
            if ($LASTEXITCODE -ne 0) { throw "Pushing '$tag' failed with exit code $LASTEXITCODE." }

            Write-Host "Pushed $tag"
          }
