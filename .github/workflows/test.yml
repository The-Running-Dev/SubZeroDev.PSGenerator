name: Test

# Static analysis, Pester and syntax checks run in the shared PowerShell CI workflow on both
# operating systems. The jobs below need Docker, the .NET SDK or a NuGet package, which the
# shared workflow does not cover.

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  powershell:
    permissions:
      contents: read
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/pwsh-ci.yml@v0
    with:
      os: '["ubuntu-latest", "windows-latest"]'
      paths: |
        src
        build
        examples
        tests
        tests-e2e
      analyzer: true
      analyzer-settings: .config/PSScriptAnalyzerSettings.psd1
      # The tests import the packaged module that Initialize-PackagedModule stages.
      pre-build: |
        ./build/Test-RepositoryHygiene.ps1
        ./build/Initialize-PackagedModule.ps1
      tests: tests
      coverage: artifacts/module/SubZeroDev.PSGenerator
      minimum-coverage: '85'
      artifact-name: pester-reports

  powershell-baseline:
    name: PowerShell 7.4 baseline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # verification: true
      - name: Install and validate PowerShell 7.4 baseline
        run: pwsh -NoProfile -File ./build/Invoke-PowerShellBaseline.ps1

  documentation:
    name: Documentation links and terminology
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # verification: true
      - name: Validate Markdown links and terminology
        run: pwsh -NoProfile -File ./build/Test-Documentation.ps1

  nuget-package:
    name: PowerShell NuGet package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # verification: true
      - name: Build, install, and import package
        run: pwsh -NoProfile -File ./build/Test-GeneratorNuGetPackage.ps1 -InstallDependencies

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: generator-nuget-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  container-e2e:
    name: Container end-to-end
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # verification: true
      - name: Run container end-to-end tests
        run: pwsh -NoProfile -File ./build/Invoke-ContainerEndToEnd.ps1 -InstallDependencies

      - name: Publish container end-to-end test report
        if: ${{ !cancelled() && env.ACT != 'true' }}
        uses: The-Running-Dev/GitHub-ActionTemplates/actions/test-report@v0
        with:
          results: artifacts/test-results/container-e2e/container-e2e.xml
          title: Container end-to-end tests
          fail-on-missing: 'true'

      - name: Upload container end-to-end test report
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pester-reports-container-e2e
          path: artifacts/test-results/container-e2e
          if-no-files-found: error
